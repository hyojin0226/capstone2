# grafana/dashboards/*.json을 "Capstone" 폴더에 올린다. UI에서 고쳐도 파일이 기준이다 (재시작하면 파일 내용으로 돌아간다)
apiVersion: 1
providers:
  - name: capstone
    folder: Capstone
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
