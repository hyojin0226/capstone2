# 자동 테스트 (tests/README.md). 로컬에서는 bash infra/scripts/run_tests.sh로 같은 단계를 돌린다.
# 스택 전체(Kafka·Spark 스트리밍·Grafana)를 띄우는 통합 검증은 CI에 넣지 않았다: WSL 16 GB 단일 머신 기준 실험이라
# GitHub 러너(7 GB)에서는 돌릴 수 없다. 통합 검증은 infra/scripts/verify_*.py, *_test.sh로 한다 (docs/reproduce.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 오프라인(추출·학습·replay) venv와 같은 버전
      - name: Install (requirements.txt의 버전 그대로, 테스트에 필요한 것만)
        run: |
          grep -E '^(pandas|pyarrow|scikit-learn|xgboost-cpu)==' requirements.txt | sed 's/ *#.*//' > /tmp/req.txt
          pip install -r /tmp/req.txt -r requirements-dev.txt
      - run: PY=python bash infra/scripts/run_tests.sh lint unit

  spark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # Spark 이미지(apache/spark:4.1.3 python3)와 같은 버전
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"       # Spark 이미지와 같은 Java
      - name: Install (Spark 이미지와 같은 해시 고정 패키지 + pyspark 4.1.3)
        run: |
          pip install --require-hashes --only-binary=:all: -r infra/spark/requirements-spark.txt
          pip install pyspark==4.1.3 -r requirements-dev.txt
      - run: python -m pytest -q tests/spark

  sql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: PY=python bash infra/scripts/run_tests.sh sql   # 같은 ClickHouse 이미지로 일회용 컨테이너
